<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanScope AI</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
              },
              accent: {
                50: '#fdf4ff',
                100: '#fae8ff',
                200: '#f5d0fe',
                300: '#f0abfc',
                400: '#e879f9',
                500: '#d946ef',
                600: '#c026d3',
                700: '#a21caf',
                800: '#86198f',
                900: '#701a75',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply bg-slate-900 min-h-screen text-white;
          background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }
        
        * {
          scrollbar-width: thin;
          scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }
      }

      @layer components {
        .glass-card {
          @apply bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-xl;
        }
        
        .glass-card-solid {
          background: rgb(30, 41, 59);
          border: 1px solid rgba(255, 255, 255, 0.15);
          @apply rounded-2xl shadow-2xl;
        }
        
        .search-dropdown-solid {
          background: rgba(30, 41, 59, 0.98);
          backdrop-filter: blur(32px);
          -webkit-backdrop-filter: blur(32px);
          border: 1px solid rgba(255, 255, 255, 0.15);
          @apply shadow-2xl;
        }
        
        .stat-card-solid {
          background: rgba(30, 41, 59, 0.92);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 255, 255, 0.12);
          @apply rounded-2xl p-4 sm:p-6 transition-all duration-300 cursor-pointer shadow-lg;
        }
        
        .stat-card-solid:hover {
          background: rgba(51, 65, 85, 0.8);
          transform: scale(1.02);
        }
        
        .gradient-text {
          @apply bg-gradient-to-r from-primary-400 via-accent-400 to-primary-400 bg-clip-text text-transparent;
        }
        
        .btn-primary {
          @apply bg-gradient-to-r from-primary-500 to-accent-500 text-white font-semibold py-2.5 sm:py-3 px-4 sm:px-6 rounded-xl
                 hover:from-primary-600 hover:to-accent-600 transform hover:scale-[1.02] transition-all duration-300
                 shadow-lg hover:shadow-primary-500/25 disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none;
        }
        
        .btn-secondary {
          background: rgba(30, 41, 59, 0.9);
          backdrop-filter: blur(12px);
          @apply border border-white/20 text-white font-medium py-2 px-4 rounded-xl
                 hover:bg-slate-700/80 transition-all duration-300;
        }
        
        .input-field {
          background: rgba(15, 23, 42, 0.6);
          @apply w-full border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30
                 focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500/50
                 transition-all duration-300;
        }

        .custom-scrollbar::-webkit-scrollbar {
          width: 6px;
          height: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.1);
          border-radius: 10px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background: rgba(255, 255, 255, 0.2);
        }
      }
    </style>

    "vite": "https://aistudiocdn.com/vite@^7.2.6",
